<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yep — QR Poster Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0e1220; overflow: hidden; }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: #0e1220; }

  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 20%, #1a1e35, #0e1220);
  }
  .scaler { transform-origin: center center; }
  .app {
    width: 1440px; height: 900px;
    background: #fafafb; border-radius: 12px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 40px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
  }
  .chrome {
    height: 36px; background: #ededed; display: flex; align-items: center;
    padding: 0 14px; gap: 8px; border-bottom: 1px solid #dcdcdc;
    flex-shrink: 0;
  }
  .chrome .dot { width: 12px; height: 12px; border-radius: 50%; }
  .chrome .url {
    margin-left: 20px; font-size: 12px; color: #5b5f6e;
    font-family: 'JetBrains Mono', monospace;
    background: #fff; padding: 4px 12px; border-radius: 999px;
    border: 1px solid #e0e0e0;
  }

  /* Tweaks */
  .tweaks-panel {
    position: fixed; right: 20px; bottom: 20px;
    width: 260px; background: #fff; border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    padding: 16px; z-index: 1000; display: none;
  }
  .tweaks-panel.open { display: block; }
  .tweaks-panel h3 { margin: 0 0 12px 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .tweaks-panel .label {
    font-size: 10px; font-weight: 700; color: #5b5f6e;
    text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 6px;
  }
  .tweaks-panel .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tweaks-panel button.chip {
    padding: 6px 10px; border-radius: 999px;
    border: 1.5px solid rgba(14,18,32,0.12); background: #fff;
    font-size: 12px; font-weight: 500; color: #2a2e3d; cursor: pointer;
  }
  .tweaks-panel button.chip.active {
    border-color: #5a5af0; background: #eeeefe; color: #5a5af0;
  }

  /* Canvas dots */
  .canvas-bg {
    background-image: radial-gradient(circle, #d5d7dd 1px, transparent 1px);
    background-size: 16px 16px;
    background-position: 0 0;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="hifi/hifi-tokens.jsx"></script>
<script type="text/babel" src="dashboard/dashboard-data.jsx"></script>
<script type="text/babel" src="dashboard/dashboard-ui.jsx"></script>
<script type="text/babel" src="posters/poster-qr.jsx"></script>
<script type="text/babel" src="posters/poster-templates.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "locationId": "kaya-mid",
  "employeeId": "aiko",
  "template": "receipt",
  "accent": "#5a5af0"
}/*EDITMODE-END*/;

function useTweaks() {
  const [s, setS] = React.useState(TWEAK_DEFAULTS);
  const set = (k, v) => {
    const next = { ...s, [k]: v };
    setS(next);
    try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*'); } catch {}
  };
  return [s, set];
}

const TEMPLATES = [
  { id: 'classic',  name: 'Classic',  sub: '5×7 wall',    size: '5 × 7 in',  Component: PosterClassic },
  { id: 'tent',     name: 'Tent card', sub: 'Table talker', size: '4 × 6 in', Component: PosterTent },
  { id: 'bold',     name: 'Bold',     sub: 'Window cling', size: '5 × 7 in',  Component: PosterBold },
  { id: 'receipt',  name: 'Check drop', sub: 'Bill holder', size: '3.5 × 7 in', Component: PosterReceipt },
];

const ACCENT_SWATCHES = [
  { id: 'indigo', value: '#5a5af0' },
  { id: 'green',  value: '#12a66a' },
  { id: 'orange', value: '#e8a033' },
  { id: 'pink',   value: '#e85a5a' },
  { id: 'teal',   value: '#2ca39a' },
  { id: 'black',  value: '#0e1220' },
];

function TopBar({ biz, onBack }) {
  return (
    <div style={{
      padding: '14px 28px', borderBottom: `1px solid ${T.ink10}`,
      background: '#fff', display: 'flex', alignItems: 'center', gap: 14,
      flexShrink: 0,
    }}>
      <div onClick={onBack} style={{
        display: 'flex', alignItems: 'center', gap: 6,
        color: T.ink60, fontSize: 13, cursor: 'pointer',
      }}>
        <Icon name="back" size={14} color={T.ink60}/>
        <span>Back to dashboard</span>
      </div>
      <div style={{ width: 1, height: 20, background: T.ink10 }}/>
      <div>
        <div style={{ fontSize: 18, fontWeight: 700, color: T.ink, letterSpacing: -0.3, lineHeight: 1.1 }}>QR posters</div>
        <div style={{ fontSize: 12, color: T.ink60, marginTop: 1 }}>
          Print and stick them at tables, checkout, or on receipts.
        </div>
      </div>
      <div style={{ flex: 1 }}/>
      <button style={{
        padding: '8px 14px', background: '#fff', color: T.ink,
        border: `1px solid ${T.ink10}`, borderRadius: 8,
        fontSize: 13, fontWeight: 500, cursor: 'pointer',
        display: 'inline-flex', alignItems: 'center', gap: 6,
      }}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="6" y="3" width="12" height="5"/><rect x="4" y="8" width="16" height="8" rx="1"/><rect x="6" y="14" width="12" height="7"/></svg>
        Print
      </button>
      <button style={{
        padding: '8px 14px', background: T.ink, color: '#fff',
        border: 'none', borderRadius: 8,
        fontSize: 13, fontWeight: 600, cursor: 'pointer',
        display: 'inline-flex', alignItems: 'center', gap: 6,
      }}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        Download PDF
      </button>
    </div>
  );
}

function FormField({ label, children, hint }) {
  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{
        fontSize: 10, fontWeight: 700, color: T.ink60,
        textTransform: 'uppercase', letterSpacing: 0.8, marginBottom: 8,
      }}>{label}</div>
      {children}
      {hint && <div style={{ fontSize: 11, color: T.ink40, marginTop: 6, lineHeight: 1.4 }}>{hint}</div>}
    </div>
  );
}

function TemplatePicker({ value, onChange, biz, emp, accent }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
      {TEMPLATES.map(t => {
        const active = value === t.id;
        const { Component } = t;
        return (
          <div key={t.id} onClick={() => onChange(t.id)}
            style={{
              border: `2px solid ${active ? T.accent : T.ink10}`,
              borderRadius: 10, padding: 8, cursor: 'pointer',
              background: active ? T.accentSoft : '#fff',
              transition: 'all 0.15s',
            }}>
            <div style={{
              height: 110, borderRadius: 6, overflow: 'hidden',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              background: T.paperWarm, position: 'relative',
            }}>
              <div style={{ pointerEvents: 'none' }}>
                <Component biz={biz} employee={emp} accent={accent} qrSeed={`${biz.id}-${emp?.id || 'none'}`} size={0.2}/>
              </div>
            </div>
            <div style={{ padding: '6px 4px 0' }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: T.ink, lineHeight: 1.1 }}>{t.name}</div>
              <div style={{ fontSize: 10, color: T.ink60, marginTop: 2 }}>{t.sub} · {t.size}</div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function SelectPill({ value, options, onChange, getKey, getLabel, getSub, getAvatar }) {
  const [open, setOpen] = React.useState(false);
  const current = options.find(o => getKey(o) === value) || options[0];
  return (
    <div style={{ position: 'relative' }}>
      <div onClick={() => setOpen(!open)} style={{
        border: `1px solid ${T.ink10}`, borderRadius: 8,
        padding: '8px 12px', display: 'flex', alignItems: 'center', gap: 10,
        cursor: 'pointer', background: '#fff',
      }}>
        {getAvatar && getAvatar(current)}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: T.ink, lineHeight: 1.1 }}>{getLabel(current)}</div>
          {getSub && <div style={{ fontSize: 11, color: T.ink60 }}>{getSub(current)}</div>}
        </div>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={T.ink60} strokeWidth="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      {open && (
        <div style={{
          position: 'absolute', left: 0, right: 0, top: '100%', marginTop: 4,
          background: '#fff', border: `1px solid ${T.ink10}`, borderRadius: 8,
          boxShadow: T.shadowMd, zIndex: 10, maxHeight: 280, overflowY: 'auto',
        }}>
          {options.map(o => {
            const k = getKey(o);
            return (
              <div key={k} onClick={() => { onChange(k); setOpen(false); }} style={{
                padding: '8px 12px', display: 'flex', alignItems: 'center', gap: 10,
                cursor: 'pointer',
                background: k === value ? T.ink05 : 'transparent',
              }}>
                {getAvatar && getAvatar(o)}
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, fontWeight: 500, color: T.ink }}>{getLabel(o)}</div>
                  {getSub && <div style={{ fontSize: 11, color: T.ink60 }}>{getSub(o)}</div>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Sidebar({ tweaks, setTweak, biz, emp, employeeOptions }) {
  return (
    <aside style={{
      width: 340, background: '#fff', borderRight: `1px solid ${T.ink10}`,
      padding: 24, overflowY: 'auto', flexShrink: 0,
    }}>
      <FormField label="Business / location">
        <SelectPill value={tweaks.locationId} options={DASH_LOCATIONS} onChange={v => setTweak('locationId', v)}
          getKey={o => o.id} getLabel={o => o.name} getSub={o => o.sub}
          getAvatar={o => (
            <div style={{ width: 24, height: 24, borderRadius: 5, background: o.color, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, fontWeight: 700 }}>{o.initials}</div>
          )}/>
      </FormField>

      <FormField label="Attribute reviews to" hint="Reviews scanned from this poster will tag this team member on the dashboard.">
        <SelectPill value={tweaks.employeeId} options={employeeOptions} onChange={v => setTweak('employeeId', v)}
          getKey={o => o.id} getLabel={o => o.name} getSub={o => o.role || ''}
          getAvatar={o => o.id === 'none' ? (
            <div style={{ width: 24, height: 24, borderRadius: '50%', background: T.ink10, color: T.ink60, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11 }}>—</div>
          ) : <Avatar seed={o.name} size={24} color={o.color}/>}/>
      </FormField>

      <FormField label="Template">
        <TemplatePicker value={tweaks.template} onChange={v => setTweak('template', v)}
          biz={biz} emp={emp} accent={tweaks.accent}/>
      </FormField>

      <FormField label="Accent color">
        <div style={{ display: 'flex', gap: 8 }}>
          {ACCENT_SWATCHES.map(s => (
            <div key={s.id} onClick={() => setTweak('accent', s.value)} style={{
              width: 32, height: 32, borderRadius: 8, cursor: 'pointer',
              background: s.value,
              boxShadow: tweaks.accent === s.value
                ? `0 0 0 2px #fff, 0 0 0 4px ${s.value}`
                : 'inset 0 0 0 1px rgba(0,0,0,0.08)',
            }}/>
          ))}
        </div>
      </FormField>

      <FormField label="Link preview">
        <div style={{
          padding: '10px 12px', background: T.paperWarm,
          border: `1px solid ${T.ink10}`, borderRadius: 8,
          display: 'flex', alignItems: 'center', gap: 8,
        }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={T.ink60} strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <span style={{ fontSize: 12, color: T.ink80, fontFamily: T.mono, flex: 1 }}>
            yep.to/{biz.id}-{emp?.id || 'none'}
          </span>
        </div>
      </FormField>

      <div style={{
        marginTop: 24, padding: '12px 14px', background: T.accentSoft,
        borderRadius: 10, display: 'flex', gap: 10, alignItems: 'flex-start',
      }}>
        <span style={{ fontSize: 16, lineHeight: 1 }}>💡</span>
        <div style={{ fontSize: 12, color: T.ink80, lineHeight: 1.5 }}>
          <b>Tip:</b> Make one poster per server so you know who earned the 5-star review. Hand them out at the start of each shift.
        </div>
      </div>
    </aside>
  );
}

function PreviewArea({ tweaks, biz, emp }) {
  const tpl = TEMPLATES.find(t => t.id === tweaks.template) || TEMPLATES[0];
  const Component = tpl.Component;
  const qrSeed = `${biz.id}-${emp?.id || 'none'}`;

  return (
    <div className="canvas-bg" style={{
      flex: 1, padding: '32px 40px', overflowY: 'auto',
      display: 'flex', flexDirection: 'column',
    }}>
      {/* Preview header */}
      <div style={{ display: 'flex', alignItems: 'center', marginBottom: 20 }}>
        <div>
          <div style={{ fontSize: 13, color: T.ink60, fontWeight: 500 }}>Preview</div>
          <div style={{ fontSize: 18, fontWeight: 700, color: T.ink, letterSpacing: -0.3, marginTop: 2 }}>
            {tpl.name} · {tpl.size}
          </div>
        </div>
        <div style={{ flex: 1 }}/>
        <div style={{
          display: 'inline-flex', background: '#fff', border: `1px solid ${T.ink10}`,
          borderRadius: 8, padding: 3, fontSize: 12,
        }}>
          {['100%', '75%', '50%'].map((z, i) => (
            <span key={z} style={{
              padding: '5px 10px', borderRadius: 6, cursor: 'pointer',
              background: i === 0 ? T.ink05 : 'transparent',
              color: i === 0 ? T.ink : T.ink60, fontWeight: i === 0 ? 600 : 500,
            }}>{z}</span>
          ))}
        </div>
      </div>

      {/* Stage: the poster with shadow */}
      <div style={{
        flex: 1, display: 'flex', alignItems: 'flex-start', justifyContent: 'center',
        paddingBottom: 32,
      }}>
        <div style={{ position: 'relative' }}>
          <Component biz={biz} employee={emp} accent={tweaks.accent} qrSeed={qrSeed}/>
          {/* ruler / dimension marks */}
          <div style={{
            position: 'absolute', top: -22, left: 0, right: 0,
            display: 'flex', alignItems: 'center', gap: 8,
          }}>
            <div style={{ flex: 1, borderTop: `1px solid ${T.ink20}` }}/>
            <div style={{ fontSize: 10, color: T.ink60, fontFamily: T.mono }}>{tpl.size.split('×')[0].trim()}</div>
            <div style={{ flex: 1, borderTop: `1px solid ${T.ink20}` }}/>
          </div>
        </div>
      </div>

      {/* Quick actions strip */}
      <div style={{
        background: '#fff', border: `1px solid ${T.ink10}`,
        borderRadius: 12, padding: 16,
        display: 'flex', alignItems: 'center', gap: 16,
      }}>
        <div style={{
          width: 40, height: 40, borderRadius: 10, background: T.accentSoft,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={T.accent} strokeWidth="2" strokeLinecap="round"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: T.ink, letterSpacing: -0.2 }}>Print at home or ship 100 pre-printed</div>
          <div style={{ fontSize: 12, color: T.ink60, marginTop: 2 }}>
            Laminated tent cards, $0.40 ea. Free shipping on orders over $25.
          </div>
        </div>
        <button style={{
          padding: '8px 14px', background: '#fff', border: `1px solid ${T.ink10}`,
          borderRadius: 8, fontSize: 13, fontWeight: 500, color: T.ink, cursor: 'pointer',
        }}>Order prints</button>
      </div>
    </div>
  );
}

function Stage({ children }) {
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const fit = () => {
      const s = Math.min(window.innerWidth / 1440, window.innerHeight / 900, 1);
      setScale(s);
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  return (
    <div className="stage">
      <div className="scaler" style={{ transform: `scale(${scale})` }}>{children}</div>
    </div>
  );
}

function TweaksPanel({ tweaks, setTweak, open, onClose }) {
  return (
    <div className={`tweaks-panel ${open ? 'open' : ''}`}>
      <h3>
        <span style={{ fontSize: 18 }}>⚙</span> Tweaks
        <span style={{ marginLeft: 'auto', cursor: 'pointer', color: '#9094a1', fontSize: 22, lineHeight: 1 }} onClick={onClose}>×</span>
      </h3>
      <div className="label">Business</div>
      <div className="row">
        {DASH_LOCATIONS.map(loc => (
          <button key={loc.id} className={`chip ${tweaks.locationId === loc.id ? 'active' : ''}`} onClick={() => setTweak('locationId', loc.id)}>
            {loc.name.split(' ')[0]} · {loc.sub}
          </button>
        ))}
      </div>
      <div className="label">Template</div>
      <div className="row">
        {TEMPLATES.map(t => (
          <button key={t.id} className={`chip ${tweaks.template === t.id ? 'active' : ''}`} onClick={() => setTweak('template', t.id)}>
            {t.name}
          </button>
        ))}
      </div>
      <div className="label">Accent</div>
      <div className="row">
        {ACCENT_SWATCHES.map(s => (
          <button key={s.id} className="chip" style={{
            borderColor: tweaks.accent === s.value ? s.value : 'rgba(14,18,32,0.12)',
            background: tweaks.accent === s.value ? s.value + '22' : '#fff',
            color: tweaks.accent === s.value ? s.value : '#2a2e3d',
            padding: '6px 8px',
          }} onClick={() => setTweak('accent', s.value)}>
            <span style={{ width: 10, height: 10, borderRadius: '50%', background: s.value, display: 'inline-block', marginRight: 4 }}/>
            {s.id}
          </button>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks();
  const [panelOpen, setPanelOpen] = React.useState(false);

  React.useEffect(() => {
    const onMsg = e => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setPanelOpen(true);
      else if (e.data.type === '__deactivate_edit_mode') setPanelOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const biz = DASH_LOCATIONS.find(l => l.id === tweaks.locationId) || DASH_LOCATIONS[0];
  const employeeOptions = [
    { id: 'none', name: 'No server (location only)', role: 'Reviews won\'t be attributed', color: null },
    ...DASH_EMPLOYEES,
  ];
  const emp = DASH_EMPLOYEES.find(e => e.id === tweaks.employeeId) || null;

  return (
    <>
      <Stage>
        <div className="app">
          <div className="chrome">
            <div className="dot" style={{ background: '#ff5f57' }}/>
            <div className="dot" style={{ background: '#febc2e' }}/>
            <div className="dot" style={{ background: '#28c840' }}/>
            <div className="url">yep.app / posters</div>
          </div>
          <TopBar biz={biz}/>
          <div style={{ display: 'flex', flex: 1, minHeight: 0 }}>
            <Sidebar tweaks={tweaks} setTweak={setTweak} biz={biz} emp={emp} employeeOptions={employeeOptions}/>
            <PreviewArea tweaks={tweaks} biz={biz} emp={emp}/>
          </div>
        </div>
      </Stage>
      <TweaksPanel tweaks={tweaks} setTweak={setTweak} open={panelOpen} onClose={() => setPanelOpen(false)}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
