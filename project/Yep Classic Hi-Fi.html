<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yep — Classic Flow (Hi-fi)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: #f4f5f7;
    color: #0e1220;
  }
  button { font-family: inherit; }

  /* Tweaks panel */
  .tweaks-panel {
    position: fixed; right: 20px; bottom: 20px;
    width: 300px; background: #fff;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(14,18,32,0.15), 0 0 0 1px rgba(14,18,32,0.06);
    padding: 18px; z-index: 1000;
    font-family: 'Inter', sans-serif; display: none;
    max-height: 80vh; overflow-y: auto;
  }
  .tweaks-panel.open { display: block; }
  .tweaks-panel h3 {
    margin: 0 0 14px 0; font-size: 14px; font-weight: 700;
    color: #0e1220; letter-spacing: -0.2px;
    display: flex; align-items: center; gap: 6px;
  }
  .tweaks-panel .section { margin-bottom: 14px; }
  .tweaks-panel .label {
    font-size: 10px; font-weight: 700; color: #5b5f6e;
    text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 8px;
  }
  .tweaks-panel .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tweaks-panel button.chip {
    padding: 6px 10px; border-radius: 999px;
    border: 1.5px solid rgba(14,18,32,0.12); background: #fff;
    font-family: inherit; font-size: 12px; font-weight: 500;
    color: #2a2e3d; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    transition: all 0.15s;
  }
  .tweaks-panel button.chip:hover { border-color: rgba(14,18,32,0.3); }
  .tweaks-panel button.chip.active {
    border-color: #5a5af0; background: #eeeefe; color: #5a5af0;
  }
  .tweaks-panel .toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; background: #f4f5f7; border-radius: 10px;
    font-size: 12px; font-weight: 500; cursor: pointer; user-select: none;
    margin-bottom: 4px;
  }
  .tweaks-panel .switch {
    width: 32px; height: 18px; border-radius: 9px;
    background: rgba(14,18,32,0.2); position: relative;
    transition: all 0.2s;
  }
  .tweaks-panel .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%; background: #fff;
    transition: all 0.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .tweaks-panel .switch.on { background: #5a5af0; }
  .tweaks-panel .switch.on::after { left: 16px; }

  .canvas-bg {
    background:
      radial-gradient(circle at 15% 20%, rgba(90,90,240,0.06), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(18,166,106,0.04), transparent 40%),
      #f4f5f7;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="hifi/hifi-tokens.jsx"></script>
<script type="text/babel" src="hifi/hifi-phone.jsx"></script>
<script type="text/babel" src="hifi/hifi-screens.jsx"></script>
<script type="text/babel" src="hifi/hifi-dashboard.jsx"></script>

<script type="text/babel">
// Data ─────────────────────────────────────────────
const BUSINESSES = [
  { id: 'lupo',    name: "Lupo's Trattoria",     tagline: 'Wood-fired Italian',        initials: 'LT', color: '#c0392b' },
  { id: 'blue',    name: 'Blue Door Cafe',       tagline: 'Brunch & specialty coffee', initials: 'BD', color: '#2a6fb4' },
  { id: 'kaya',    name: 'Kaya Sushi',           tagline: 'Omakase · Midtown',         initials: 'KS', color: '#0e1220' },
  { id: 'sunrise', name: 'Sunrise Diner',        tagline: 'Open 24/7 since 1978',      initials: 'SD', color: '#e09026' },
];

const EMPLOYEES_BY_BIZ = {
  lupo: [
    { id: 'david',   name: 'David Chen',     role: 'Server · Floor 2',     since: '2022', color: '#3a79e8' },
    { id: 'maria',   name: 'Maria Rossi',    role: 'Host',                 since: '2024', color: '#e85a5a' },
  ],
  blue: [
    { id: 'david',   name: 'David Chen',     role: 'Barista',              since: '2023', color: '#3a79e8' },
    { id: 'sam',     name: 'Sam Patel',      role: 'Shift lead',           since: '2021', color: '#7a52d4' },
  ],
  kaya: [
    { id: 'david',   name: 'David Chen',     role: 'Sushi chef',           since: '2022', color: '#3a79e8' },
    { id: 'aiko',    name: 'Aiko Tanaka',    role: 'Head server',          since: '2020', color: '#c44fa8' },
  ],
  sunrise: [
    { id: 'david',   name: 'David Chen',     role: 'Server · Night',       since: '2023', color: '#3a79e8' },
    { id: 'rita',    name: 'Rita Johnson',   role: 'Manager',              since: '2015', color: '#2ca39a' },
  ],
};

// Mock dashboard stats for David
const DAVID_STATS = {
  avg: 4.7, total: 142, public: 118,
  dist: { 5: 72, 4: 19, 3: 5, 2: 3, 1: 1 },
  recent: [
    { stars: 5, public: true,  text: 'David was incredible — knew the whole menu and recommended the perfect wine.', when: '2 days ago' },
    { stars: 5, public: true,  text: 'Ask for David! Made our anniversary dinner so special.', when: '4 days ago' },
    { stars: 2, public: false, text: 'Felt rushed even though it wasn\'t busy.', when: '1 week ago' },
  ],
};

// Tweaks ────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "businessId": "kaya",
  "employeeId": "aiko",
  "showGoogle": true,
  "showYelp": true,
  "showFacebook": false,
  "showTripAdvisor": false
}/*EDITMODE-END*/;

function useTweaks() {
  const [s, setS] = React.useState(TWEAK_DEFAULTS);
  const set = (k, v) => {
    const next = { ...s, [k]: v };
    setS(next);
    try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*'); } catch {}
  };
  return [s, set];
}

function TweaksPanel({ tweaks, setTweak, open, onClose }) {
  const employees = EMPLOYEES_BY_BIZ[tweaks.businessId] || [];
  return (
    <div className={`tweaks-panel ${open ? 'open' : ''}`}>
      <h3>
        <span style={{ fontSize: 18 }}>⚙</span> Tweaks
        <span style={{ marginLeft: 'auto', cursor: 'pointer', color: '#9094a1', fontSize: 22, lineHeight: 1 }} onClick={onClose}>×</span>
      </h3>

      <div className="section">
        <div className="label">Business</div>
        <div className="row">
          {BUSINESSES.map(b => (
            <button key={b.id}
              className={`chip ${tweaks.businessId === b.id ? 'active' : ''}`}
              onClick={() => setTweak('businessId', b.id)}>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: b.color, display: 'inline-block' }}/>
              {b.name}
            </button>
          ))}
        </div>
      </div>

      <div className="section">
        <div className="label">Employee link</div>
        <div className="row">
          <button className={`chip ${tweaks.employeeId === 'none' ? 'active' : ''}`}
            onClick={() => setTweak('employeeId', 'none')}>No employee</button>
          {employees.map(e => (
            <button key={e.id}
              className={`chip ${tweaks.employeeId === e.id ? 'active' : ''}`}
              onClick={() => setTweak('employeeId', e.id)}>
              <span style={{ width: 14, height: 14, borderRadius: '50%', background: e.color, display: 'inline-block' }}/>
              {e.name.split(' ')[0]}
            </button>
          ))}
        </div>
      </div>

      <div className="section">
        <div className="label">Platforms</div>
        {[
          ['showGoogle', 'Google'],
          ['showYelp', 'Yelp'],
          ['showFacebook', 'Facebook'],
          ['showTripAdvisor', 'TripAdvisor'],
        ].map(([k, label]) => (
          <div key={k} className="toggle" onClick={() => setTweak(k, !tweaks[k])}>
            <span>{label}</span>
            <span className={`switch ${tweaks[k] ? 'on' : ''}`}/>
          </div>
        ))}
      </div>
    </div>
  );
}

// Interactive phone — for the live demo column
function LivePhone({ business, employee, platforms }) {
  const [stage, setStage] = React.useState('rating'); // rating | positive | negative | thanks
  const [stars, setStars] = React.useState(0);
  const [positive, setPositive] = React.useState(true);

  const onStar = (n) => {
    setStars(n);
    setTimeout(() => {
      if (n >= 4) { setPositive(true); setStage('positive'); }
      else { setPositive(false); setStage('negative'); }
    }, 450);
  };

  const reset = () => { setStage('rating'); setStars(0); };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
      <HiPhone width={390} height={810} label="Live prototype" labelNote="tap a star to begin">
        {stage === 'rating' && <RatingScreen business={business} employee={employee} activeStar={stars} onStar={onStar}/>}
        {stage === 'positive' && <PositiveScreen business={business} employee={employee} enabledPlatforms={platforms}/>}
        {stage === 'negative' && <NegativeScreen business={business} employee={employee} selectedChips={[1,2]}/>}
        {stage === 'thanks' && <ThanksScreen business={business} employee={employee} positive={positive}/>}
      </HiPhone>
      <div style={{ display: 'flex', gap: 8, fontFamily: T.sans, fontSize: 12 }}>
        <button onClick={reset} style={{
          padding: '8px 14px', background: '#fff', border: `1px solid ${T.ink10}`,
          borderRadius: T.r.pill, cursor: 'pointer', color: T.ink80, fontWeight: 500,
        }}>↺ Restart</button>
        <button onClick={() => setStage('thanks')} style={{
          padding: '8px 14px', background: '#fff', border: `1px solid ${T.ink10}`,
          borderRadius: T.r.pill, cursor: 'pointer', color: T.ink80, fontWeight: 500,
        }}>Jump to thanks</button>
      </div>
    </div>
  );
}

// App ──────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks();
  const [panelOpen, setPanelOpen] = React.useState(false);

  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setPanelOpen(true);
      else if (e.data.type === '__deactivate_edit_mode') setPanelOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const business = BUSINESSES.find(b => b.id === tweaks.businessId) || BUSINESSES[0];
  const employees = EMPLOYEES_BY_BIZ[business.id] || [];
  const employee = tweaks.employeeId === 'none' ? null : (employees.find(e => e.id === tweaks.employeeId) || employees[0]);
  const platforms = {
    google: tweaks.showGoogle,
    yelp: tweaks.showYelp,
    fb: tweaks.showFacebook,
    tripadvisor: tweaks.showTripAdvisor,
  };

  // David's dashboard data gets rebadged with current employee
  const dashEmp = employee || { name: 'David Chen', role: 'Server', since: '2022', color: '#3a79e8' };

  return (
    <>
      <DesignCanvas minScale={0.1} maxScale={3}>
        <div style={{ paddingTop: 40, minHeight: 'calc(100vh - 80px)' }}>

          {/* Title */}
          <div style={{ padding: '0 60px 40px', maxWidth: 1100 }}>
            <div style={{
              display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 6,
            }}>
              <YepMark size={44} color={T.ink} dot={T.accent}/>
              <span style={{ fontSize: 18, fontWeight: 500, color: T.ink60 }}>
                / Classic flow — hi-fi v1
              </span>
            </div>
            <div style={{ fontSize: 15, color: T.ink60, maxWidth: 720, lineHeight: 1.5, marginBottom: 18 }}>
              QR scan → rate → 4+ stars go public, 1–3 go private to the owner. Each employee has their own link so reviews tie back to them — good or bad.
            </div>
            <div style={{
              display: 'inline-flex', alignItems: 'center', gap: 10,
              padding: '8px 14px', background: '#fff', border: `1px solid ${T.ink10}`,
              borderRadius: T.r.pill, fontSize: 12, color: T.ink80,
              fontFamily: T.mono, boxShadow: T.shadowSm,
            }}>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: business.color }}/>
              <span style={{ color: T.ink60 }}>yep.link /</span>
              <b>{business.id}</b>
              {employee && <><span style={{ color: T.ink60 }}>/</span><b style={{ color: T.accent }}>{employee.id}</b></>}
            </div>
          </div>

          {/* Section 1 — Live interactive prototype */}
          <DCSection
            title="Live prototype"
            subtitle="Tap a star — flow branches based on rating. Stars 4+ go to public review, 1–3 go to private feedback."
          >
            <DCArtboard width="auto">
              <div style={{ padding: '60px 80px', background: '#fff' }}>
                <LivePhone business={business} employee={employee} platforms={platforms}/>
              </div>
            </DCArtboard>
          </DCSection>

          {/* Section 2 — Positive flow */}
          <DCSection
            title="Positive path (4–5 stars)"
            subtitle={employee
              ? `Prompts the customer to mention ${employee.name.split(' ')[0]} by name in their public review.`
              : 'Customer picks where to leave a public review.'}
          >
            <DCArtboard width="auto">
              <div style={{ padding: 60, display: 'flex', gap: 48, background: '#fff' }}>
                <HiPhone width={340} height={720} label="1. Rating" labelNote={employee ? `via ${employee.name.split(' ')[0]}'s link` : 'via business link'}>
                  <RatingScreen business={business} employee={employee} activeStar={5}/>
                </HiPhone>
                <HiPhone width={340} height={720} label="2. Share publicly" labelNote="platform picker">
                  <PositiveScreen business={business} employee={employee} enabledPlatforms={platforms}/>
                </HiPhone>
                <HiPhone width={340} height={720} label="3. Thanks" labelNote="returns to link or closes">
                  <ThanksScreen business={business} employee={employee} positive/>
                </HiPhone>
              </div>
            </DCArtboard>
          </DCSection>

          {/* Section 3 — Negative flow */}
          <DCSection
            title="Private path (1–3 stars)"
            subtitle="Goes straight to management so they can fix it and follow up."
          >
            <DCArtboard width="auto">
              <div style={{ padding: 60, display: 'flex', gap: 48, background: '#fff' }}>
                <HiPhone width={340} height={720} label="1. Low rating" labelNote="2 stars">
                  <RatingScreen business={business} employee={employee} activeStar={2}/>
                </HiPhone>
                <HiPhone width={340} height={720} label="2. What happened" labelNote="chips + optional text/photo/email">
                  <NegativeScreen business={business} employee={employee} selectedChips={[1, 2]} hasText/>
                </HiPhone>
                <HiPhone width={340} height={720} label="3. Thanks" labelNote="owner gets pinged">
                  <ThanksScreen business={business} employee={employee} positive={false}/>
                </HiPhone>
              </div>
            </DCArtboard>
          </DCSection>

          {/* Section 4 — Dashboard peek */}
          <DCSection
            title="↓ Back-end peek — employee view"
            subtitle="What management sees for each employee. Public reviews + private feedback, both tied to the individual."
          >
            <DCArtboard width="auto">
              <div style={{
                padding: 48, display: 'flex', gap: 40,
                background: 'linear-gradient(135deg, #0e1220, #1a1e35)',
                alignItems: 'center',
              }}>
                {/* left: the mock yep owner dashboard frame */}
                <div style={{
                  width: 440, borderRadius: T.r.lg, overflow: 'hidden',
                  boxShadow: '0 30px 60px rgba(0,0,0,0.4)', background: T.paper,
                }}>
                  {/* window bar */}
                  <div style={{
                    background: '#fafafb', padding: '10px 14px',
                    display: 'flex', alignItems: 'center', gap: 6,
                    borderBottom: `1px solid ${T.ink10}`,
                  }}>
                    <div style={{ width: 11, height: 11, borderRadius: '50%', background: '#ff5f57' }}/>
                    <div style={{ width: 11, height: 11, borderRadius: '50%', background: '#ffbd2e' }}/>
                    <div style={{ width: 11, height: 11, borderRadius: '50%', background: '#28c840' }}/>
                    <div style={{ flex: 1, textAlign: 'center', fontSize: 11, color: T.ink60, fontFamily: T.mono }}>
                      yep.app / {business.id} / team / {dashEmp.name.split(' ')[0].toLowerCase()}
                    </div>
                  </div>
                  <div style={{ padding: 20 }}>
                    <EmployeeStatCard employee={dashEmp} business={business} stats={DAVID_STATS}/>
                  </div>
                </div>

                {/* right: explainer */}
                <div style={{ color: '#fff', maxWidth: 360, fontFamily: T.sans }}>
                  <div style={{
                    display: 'inline-flex', alignItems: 'center', gap: 6,
                    padding: '5px 10px', background: 'rgba(255,255,255,0.12)',
                    borderRadius: T.r.pill, fontSize: 11, fontWeight: 600,
                    letterSpacing: 0.5, textTransform: 'uppercase', marginBottom: 14,
                  }}>
                    <Icon name="sparkle" size={12} color="#fff"/>
                    How attribution works
                  </div>
                  <div style={{ fontSize: 22, fontWeight: 700, letterSpacing: -0.4, lineHeight: 1.2, marginBottom: 12 }}>
                    Every employee gets their own Yep link.
                  </div>
                  <div style={{ fontSize: 14, lineHeight: 1.6, color: 'rgba(255,255,255,0.75)', marginBottom: 20 }}>
                    When a customer scans <b style={{ color: '#fff', fontFamily: T.mono, fontSize: 12 }}>yep.link/{business.id}/{dashEmp.name.split(' ')[0].toLowerCase()}</b>, the review is tagged to them automatically. Public + private, good + bad — all in one place.
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                    {[
                      ['Public mentions', 'Count reviews where the employee is named by the customer'],
                      ['Private notes', 'Negative feedback never goes public — management only'],
                      ['Rating distribution', 'See trends at a glance; spot coachable moments early'],
                    ].map(([title, desc], i) => (
                      <div key={i} style={{
                        display: 'flex', gap: 10, padding: '10px 12px',
                        background: 'rgba(255,255,255,0.06)',
                        borderRadius: T.r.md,
                      }}>
                        <div style={{
                          width: 22, height: 22, borderRadius: '50%',
                          background: T.accent, color: '#fff',
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          fontSize: 11, fontWeight: 700, flexShrink: 0,
                        }}>{i + 1}</div>
                        <div>
                          <div style={{ fontSize: 13, fontWeight: 600, color: '#fff' }}>{title}</div>
                          <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.6)', lineHeight: 1.4 }}>{desc}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </DCArtboard>
          </DCSection>

          {/* Next steps */}
          <div style={{ padding: '0 60px 100px', display: 'flex', gap: 20, flexWrap: 'wrap', maxWidth: 1100 }}>
            <DCPostIt rotate={-2} width={240} style={{ position: 'relative' }}>
              <b>Open questions</b><br/>
              · How should customer know this link = David's? (photo in QR poster?)<br/>
              · Team leaderboard in dashboard?<br/>
              · Shift-based links (AM/PM)?
            </DCPostIt>
            <DCPostIt rotate={1.5} width={240} style={{ position: 'relative' }}>
              <b>Next iteration ideas</b><br/>
              · Full owner dashboard<br/>
              · Business signup / onboarding<br/>
              · QR poster generator<br/>
              · Employee self-service view
            </DCPostIt>
            <DCPostIt rotate={-1} width={240} style={{ position: 'relative' }}>
              <b>Back-end model</b><br/>
              review ← {'{'} business_id, employee_id?, stars, public/private, platform, text, photo?, email? {'}'}
            </DCPostIt>
          </div>

        </div>
      </DesignCanvas>

      <TweaksPanel tweaks={tweaks} setTweak={setTweak} open={panelOpen} onClose={() => setPanelOpen(false)}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
