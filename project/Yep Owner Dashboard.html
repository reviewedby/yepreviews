<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yep — Owner Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0e1220; overflow: hidden; }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: #0e1220; }
  button { font-family: inherit; }

  /* scale wrapper — dashboard is 1440x900, scale to fit viewport */
  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 20%, #1a1e35, #0e1220);
  }
  .scaler { transform-origin: center center; }
  .app {
    width: 1440px; height: 900px;
    background: #fafafb; border-radius: 12px;
    display: flex; overflow: hidden;
    box-shadow: 0 40px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
  }

  /* fake traffic lights bar */
  .chrome {
    height: 36px; background: #ededed; display: flex; align-items: center;
    padding: 0 14px; gap: 8px; border-bottom: 1px solid #dcdcdc;
    flex-shrink: 0;
  }
  .chrome .dot { width: 12px; height: 12px; border-radius: 50%; }
  .chrome .url {
    margin-left: 20px; font-size: 12px; color: #5b5f6e;
    font-family: 'JetBrains Mono', monospace;
    background: #fff; padding: 4px 12px; border-radius: 999px;
    border: 1px solid #e0e0e0;
  }

  /* Tweaks panel */
  .tweaks-panel {
    position: fixed; right: 20px; bottom: 20px;
    width: 280px; background: #fff;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    padding: 16px; z-index: 1000;
    font-family: 'Inter', sans-serif; display: none;
  }
  .tweaks-panel.open { display: block; }
  .tweaks-panel h3 { margin: 0 0 12px 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .tweaks-panel .section { margin-bottom: 12px; }
  .tweaks-panel .label {
    font-size: 10px; font-weight: 700; color: #5b5f6e;
    text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 6px;
  }
  .tweaks-panel .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tweaks-panel button.chip {
    padding: 6px 10px; border-radius: 999px;
    border: 1.5px solid rgba(14,18,32,0.12); background: #fff;
    font-family: inherit; font-size: 12px; font-weight: 500;
    color: #2a2e3d; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .tweaks-panel button.chip.active {
    border-color: #5a5af0; background: #eeeefe; color: #5a5af0;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="hifi/hifi-tokens.jsx"></script>
<script type="text/babel" src="dashboard/dashboard-data.jsx"></script>
<script type="text/babel" src="dashboard/dashboard-ui.jsx"></script>
<script type="text/babel" src="dashboard/dashboard-sections.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "locationId": "kaya-mid",
  "hasUrgent": true
}/*EDITMODE-END*/;

function useTweaks() {
  const [s, setS] = React.useState(TWEAK_DEFAULTS);
  const set = (k, v) => {
    const next = { ...s, [k]: v };
    setS(next);
    try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*'); } catch {}
  };
  return [s, set];
}

function Sidebar({ location, onLocationChange }) {
  const [open, setOpen] = React.useState(false);
  return (
    <aside style={{
      width: 220, background: '#fff',
      borderRight: `1px solid ${T.ink10}`,
      display: 'flex', flexDirection: 'column',
      fontFamily: T.sans,
    }}>
      {/* Brand + location switcher */}
      <div style={{ padding: '18px 14px 12px', borderBottom: `1px solid ${T.ink10}` }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
          <YepMark size={20} color={T.ink} dot={T.accent}/>
          <span style={{ fontSize: 11, color: T.ink60, fontWeight: 500, marginLeft: 'auto' }}>for owners</span>
        </div>
        <div style={{ position: 'relative' }}>
          <div onClick={() => setOpen(!open)} style={{
            padding: '8px 10px', border: `1px solid ${T.ink10}`,
            borderRadius: 8, display: 'flex', alignItems: 'center', gap: 10,
            cursor: 'pointer', background: T.paperWarm,
          }}>
            <div style={{
              width: 28, height: 28, borderRadius: 6, background: location.color,
              color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 11, fontWeight: 700,
            }}>{location.initials}</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: T.ink, lineHeight: 1.1 }}>{location.name}</div>
              <div style={{ fontSize: 10, color: T.ink60 }}>{location.sub}</div>
            </div>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={T.ink60} strokeWidth="2.5" strokeLinecap="round">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </div>
          {open && (
            <div style={{
              position: 'absolute', top: '100%', left: 0, right: 0, marginTop: 4,
              background: '#fff', border: `1px solid ${T.ink10}`, borderRadius: 8,
              boxShadow: T.shadowMd, zIndex: 10, padding: 4,
            }}>
              {DASH_LOCATIONS.map(loc => (
                <div key={loc.id} onClick={() => { onLocationChange(loc.id); setOpen(false); }} style={{
                  padding: '7px 10px', display: 'flex', alignItems: 'center', gap: 10,
                  borderRadius: 6, cursor: 'pointer',
                  background: loc.id === location.id ? T.ink05 : 'transparent',
                }}>
                  <div style={{
                    width: 22, height: 22, borderRadius: 5, background: loc.color,
                    color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: 10, fontWeight: 700,
                  }}>{loc.initials}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 12, fontWeight: 600, color: T.ink }}>{loc.name}</div>
                    <div style={{ fontSize: 10, color: T.ink60 }}>{loc.sub}</div>
                  </div>
                </div>
              ))}
              <div style={{
                padding: '7px 10px', fontSize: 12, fontWeight: 500,
                color: T.accent, cursor: 'pointer', borderTop: `1px solid ${T.ink10}`,
                marginTop: 4,
              }}>+ Add location</div>
            </div>
          )}
        </div>
      </div>

      {/* Nav */}
      <div style={{ padding: '14px 10px', flex: 1 }}>
        <NavItem label="Overview" active icon={
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        }/>
        <NavItem label="Inbox" count={3} icon={
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
        }/>
        <NavItem label="Reviews" icon={
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17l-6.1 3.5 1.5-6.8L2.2 9l6.9-.7L12 2z"/></svg>
        }/>
        <NavItem label="Team" icon={
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="9" cy="7" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7"/><path d="M17 11a4 4 0 000-8"/><path d="M22 21c0-3-2-6-5-6.5"/></svg>
        }/>
        <NavItem label="QR codes" icon={
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM21 14v7h-4M14 21h3"/></svg>
        }/>
        <NavItem label="Analytics" icon={
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 4 4 5-5"/></svg>
        }/>

        <div style={{ marginTop: 24, marginBottom: 8, padding: '0 10px', fontSize: 10, fontWeight: 700, color: T.ink40, textTransform: 'uppercase', letterSpacing: 0.7 }}>Settings</div>
        <NavItem label="Platforms" icon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>}/>
        <NavItem label="Billing" icon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/></svg>}/>
      </div>

      {/* User */}
      <div style={{
        padding: 12, borderTop: `1px solid ${T.ink10}`,
        display: 'flex', alignItems: 'center', gap: 10,
      }}>
        <Avatar seed="Jordan Kim" size={28}/>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: T.ink, lineHeight: 1.1 }}>Jordan Kim</div>
          <div style={{ fontSize: 10, color: T.ink60 }}>Owner</div>
        </div>
      </div>
    </aside>
  );
}

function Main({ location, hasUrgent }) {
  const employeeLookup = Object.fromEntries(DASH_EMPLOYEES.map(e => [e.id, e]));
  const urgentItems = hasUrgent ? ACTION_ITEMS : [];
  const topEmployees = [...DASH_EMPLOYEES].sort((a, b) => b.avg - a.avg).slice(0, 5);

  return (
    <div style={{ flex: 1, overflow: 'auto', background: '#fafafb' }}>
      {/* Header */}
      <div style={{
        padding: '18px 32px', display: 'flex', alignItems: 'center', gap: 16,
        background: '#fff', borderBottom: `1px solid ${T.ink10}`, position: 'sticky', top: 0, zIndex: 5,
      }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 700, color: T.ink, letterSpacing: -0.4, lineHeight: 1.1, fontFamily: T.sans }}>Overview</div>
          <div style={{ fontSize: 12, color: T.ink60, marginTop: 2 }}>Good morning, Jordan — here's what's new.</div>
        </div>
        <div style={{ flex: 1 }}/>
        <div style={{
          display: 'inline-flex', alignItems: 'center', gap: 6,
          padding: '6px 10px', background: T.paperWarm, border: `1px solid ${T.ink10}`,
          borderRadius: 8, fontSize: 12, color: T.ink60,
        }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={T.ink60} strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Last 30 days
        </div>
        <button style={{
          padding: '7px 14px', background: T.ink, color: '#fff',
          border: 'none', borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: 'pointer',
        }}>+ Invite teammate</button>
      </div>

      <div style={{ padding: 32, maxWidth: 1240 }}>

        {/* Action needed */}
        {urgentItems.length > 0 && (
          <section style={{ marginBottom: 28 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
              <div style={{
                width: 8, height: 8, borderRadius: '50%', background: T.danger,
                boxShadow: `0 0 0 4px ${T.danger}22`,
              }}/>
              <div style={{ fontSize: 15, fontWeight: 700, color: T.ink, letterSpacing: -0.2 }}>Action needed</div>
              <div style={{ fontSize: 12, color: T.ink60 }}>{urgentItems.length} unresolved</div>
              <div style={{ flex: 1 }}/>
              <span style={{ fontSize: 12, color: T.accent, fontWeight: 500, cursor: 'pointer' }}>View all →</span>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {urgentItems.map(item => (
                <ActionCard key={item.id} item={item} employee={item.employee ? employeeLookup[item.employee] : null}/>
              ))}
            </div>
          </section>
        )}

        {/* Stats */}
        <section style={{ display: 'flex', gap: 12, marginBottom: 28 }}>
          <StatCard label="Avg rating" value="4.7" sub="/ 5" trend={0.2} accent={T.accent}/>
          <StatCard label="Reviews this month" value="142" trend={18}/>
          <StatCard label="Public → Google" value="98" sub="69%" trend={12}/>
          <StatCard label="Response time" value="2.4h" sub="avg" trend={-15}/>
        </section>

        {/* Chart + Leaderboard */}
        <section style={{ display: 'grid', gridTemplateColumns: '1fr 360px', gap: 20, marginBottom: 28 }}>
          <div style={{
            background: '#fff', border: `1px solid ${T.ink10}`,
            borderRadius: 12, padding: 20,
          }}>
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: 8 }}>
              <div>
                <div style={{ fontSize: 14, fontWeight: 700, color: T.ink, letterSpacing: -0.2 }}>Rating trend</div>
                <div style={{ fontSize: 11, color: T.ink60 }}>Average stars per day · past 30 days</div>
              </div>
              <div style={{ flex: 1 }}/>
              <div style={{ display: 'inline-flex', gap: 14, alignItems: 'center' }}>
                <div style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}>
                  <div style={{ width: 10, height: 2, background: T.accent, borderRadius: 1 }}/>
                  <span style={{ fontSize: 11, color: T.ink60 }}>Avg rating</span>
                </div>
                <div style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}>
                  <div style={{ width: 8, height: 8, background: T.accent, opacity: 0.2, borderRadius: 1 }}/>
                  <span style={{ fontSize: 11, color: T.ink60 }}>Volume</span>
                </div>
              </div>
            </div>
            <TrendChart data={TREND_DATA} volumeData={VOLUME_DATA} width={680} height={200}/>
          </div>

          <div style={{
            background: '#fff', border: `1px solid ${T.ink10}`,
            borderRadius: 12, padding: 20,
          }}>
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: 6 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: T.ink, letterSpacing: -0.2 }}>Team leaderboard</div>
              <div style={{ flex: 1 }}/>
              <span style={{ fontSize: 11, color: T.accent, fontWeight: 500, cursor: 'pointer' }}>All →</span>
            </div>
            <div style={{ fontSize: 11, color: T.ink60, marginBottom: 8 }}>Top rated this month</div>
            {topEmployees.map((emp, i) => (
              <LeaderRow key={emp.id} employee={emp} rank={i + 1}/>
            ))}
          </div>
        </section>

        {/* Recent feedback */}
        <section style={{
          background: '#fff', border: `1px solid ${T.ink10}`,
          borderRadius: 12, padding: 20, marginBottom: 40,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', marginBottom: 4 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: T.ink, letterSpacing: -0.2 }}>Recent feedback</div>
            <div style={{ flex: 1 }}/>
            <div style={{ display: 'flex', gap: 6, fontSize: 11 }}>
              {['All', 'Public', 'Private', '5★', '1–3★'].map((t, i) => (
                <span key={t} style={{
                  padding: '4px 10px', borderRadius: 999,
                  background: i === 0 ? T.ink05 : 'transparent',
                  color: i === 0 ? T.ink : T.ink60,
                  fontWeight: i === 0 ? 600 : 500, cursor: 'pointer',
                }}>{t}</span>
              ))}
            </div>
          </div>
          <div style={{ fontSize: 11, color: T.ink60, marginBottom: 4 }}>Latest reviews across all sources</div>
          {RECENT_FEEDBACK.map(item => (
            <FeedbackRow key={item.id} item={item} employeeLookup={employeeLookup}/>
          ))}
        </section>

      </div>
    </div>
  );
}

function Stage({ children }) {
  const ref = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const fit = () => {
      const vw = window.innerWidth, vh = window.innerHeight;
      const s = Math.min(vw / 1440, vh / 900, 1);
      setScale(s);
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  return (
    <div className="stage">
      <div className="scaler" style={{ transform: `scale(${scale})` }}>
        {children}
      </div>
    </div>
  );
}

function TweaksPanel({ tweaks, setTweak, open, onClose }) {
  return (
    <div className={`tweaks-panel ${open ? 'open' : ''}`}>
      <h3>
        <span style={{ fontSize: 18 }}>⚙</span> Tweaks
        <span style={{ marginLeft: 'auto', cursor: 'pointer', color: '#9094a1', fontSize: 22, lineHeight: 1 }} onClick={onClose}>×</span>
      </h3>
      <div className="section">
        <div className="label">Location</div>
        <div className="row">
          {DASH_LOCATIONS.map(loc => (
            <button key={loc.id}
              className={`chip ${tweaks.locationId === loc.id ? 'active' : ''}`}
              onClick={() => setTweak('locationId', loc.id)}>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: loc.color, display: 'inline-block' }}/>
              {loc.name} · {loc.sub}
            </button>
          ))}
        </div>
      </div>
      <div className="section">
        <div className="label">Urgent inbox</div>
        <div className="row">
          <button className={`chip ${tweaks.hasUrgent ? 'active' : ''}`} onClick={() => setTweak('hasUrgent', true)}>Show action-needed</button>
          <button className={`chip ${!tweaks.hasUrgent ? 'active' : ''}`} onClick={() => setTweak('hasUrgent', false)}>Hide (empty state)</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks();
  const [panelOpen, setPanelOpen] = React.useState(false);
  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setPanelOpen(true);
      else if (e.data.type === '__deactivate_edit_mode') setPanelOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const location = DASH_LOCATIONS.find(l => l.id === tweaks.locationId) || DASH_LOCATIONS[0];
  return (
    <>
      <Stage>
        <div className="app">
          <div style={{ display: 'flex', flexDirection: 'column', width: '100%' }}>
            <div className="chrome">
              <div className="dot" style={{ background: '#ff5f57' }}/>
              <div className="dot" style={{ background: '#febc2e' }}/>
              <div className="dot" style={{ background: '#28c840' }}/>
              <div className="url">yep.app / {location.id}</div>
            </div>
            <div style={{ display: 'flex', flex: 1, minHeight: 0 }}>
              <Sidebar location={location} onLocationChange={(id) => setTweak('locationId', id)}/>
              <Main location={location} hasUrgent={tweaks.hasUrgent}/>
            </div>
          </div>
        </div>
      </Stage>
      <TweaksPanel tweaks={tweaks} setTweak={setTweak} open={panelOpen} onClose={() => setPanelOpen(false)}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
